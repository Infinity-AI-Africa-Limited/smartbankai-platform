name: SmartBank AI Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and verify ML compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform
        uses: actions/checkout@v4

      - name: Checkout pinned ML contract source
        uses: actions/checkout@v4
        with:
          repository: Infinity-AI-Africa-Limited/smartbankAI-ml
          ref: 77c3adc
          path: ml-services

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Verify pinned ML API contract
        env:
          ML_CONTRACT_PATH: ml-services/contracts/ml-orchestrator.v1.openapi.yaml
        run: node scripts/check-ml-contract.mjs

  build:
    name: Build platform
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
