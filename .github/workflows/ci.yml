name: SmartBank AI Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest

    # The suite exercises real queries. Without a database the database-backed
    # cases cannot run, and a green tick would mean less than it appears to.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: smartbank_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/smartbank_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node, otherwise `cache: pnpm`
      # cannot find the binary it is asked to cache for.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sync the schema straight to the ephemeral database. Committed migrations
      # currently lag drizzle/schema.ts, so applying them would leave the
      # customer tables missing; push guarantees the tests run against the
      # schema the application actually expects.
      - name: Apply database schema
        run: pnpm exec drizzle-kit push --force

      - name: Verify TypeScript
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
