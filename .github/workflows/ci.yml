name: SmartBank AI Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and verify ML compatibility
    runs-on: ubuntu-latest

    # The suite exercises real queries, and the advisory paths fail closed when
    # no database is reachable. Without one, a green tick would mean less than
    # it appears to.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: smartbank_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/smartbank_ci

    steps:
      - name: Checkout platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately `migrate`, not `push`. push diffs the schema straight onto
      # the database and would hide exactly the defect this guards: migrations
      # that no longer build the schema the application expects. This is the
      # command a deployment runs.
      - name: Migrate a clean database
        run: pnpm db:migrate

      - name: Verify TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Verify pinned ML API contract
        env:
          ML_CONTRACT_PATH: contracts/ml-orchestrator.v1.openapi.yaml
        run: node scripts/check-ml-contract.mjs

  build:
    name: Build platform
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
