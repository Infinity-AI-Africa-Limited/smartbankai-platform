name: SmartBank AI Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and verify ML compatibility
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_verify_only
          MYSQL_DATABASE: smartbankai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci_verify_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout platform
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      # Blocking. The backlog that made this unblockable - 3 critical and 49 high,
      # including SQL injection in drizzle-orm - is cleared. Keep it at zero.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Apply migrations to a clean database
        env:
          DATABASE_URL: mysql://root:ci_verify_only@127.0.0.1:3306/smartbankai
        run: pnpm exec drizzle-kit migrate

      - name: Verify the database round-trip
        env:
          DATABASE_URL: mysql://root:ci_verify_only@127.0.0.1:3306/smartbankai
        run: pnpm exec tsx scripts/verify-db-roundtrip.mjs

      - name: Verify pinned ML API contract
        env:
          ML_CONTRACT_PATH: contracts/ml-orchestrator.v1.openapi.yaml
        run: node scripts/check-ml-contract.mjs

  build:
    name: Build platform
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
